[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigen2"
version = "0.1.0"
description = "OmniGen2: A comprehensive AI/ML library for image generation, understanding, and editing"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "click>=8.2.1",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "gradio>=5.38.2",
    "pillow>=11.3.0",
    "requests>=2.32.4",
    "ruff>=0.12.7",
    "torch>=2.6.0",
    "accelerate>=1.9.0",
    "diffusers>=0.34.0",
    "einops>=0.8.1",
    "flash-attn==2.7.4.post1",
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.3",
    "ninja>=1.11.1.4",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.12.0.88",
    "python-dotenv>=1.1.1",
    "scipy>=1.16.1",
    "timm>=1.0.19",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers==4.51.3",
    "wandb>=0.21.0",
    "wheel>=0.45.1",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnigen2*"]